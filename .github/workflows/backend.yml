name: Backend
on:
  push:
    paths: ["backend/**", "fly.toml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "fly.toml", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobhunt
          POSTGRES_PASSWORD: jobhunt
          POSTGRES_DB: jobhunt
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://jobhunt:jobhunt@localhost:5432/jobhunt
      DIRECT_DATABASE_URL: postgresql://jobhunt:jobhunt@localhost:5432/jobhunt
      AUTH_JWT_SECRET: ci-auth-secret
      MAIL_TOKEN_ENCRYPTION_KEY: ci-mail-token-key-change
      OBJECT_ENCRYPTION_KEY: ci-object-key-change
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
