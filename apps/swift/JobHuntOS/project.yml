name: JobHuntOS
options:
  bundleIdPrefix: com.jobhuntos
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  JobHuntOSPackage:
    path: .
schemes:
  JobHuntOS-iOS:
    build:
      targets:
        JobHuntOS-iOS: all
    run:
      config: Debug
      simulateLocation:
        allow: false
  JobHuntOS-macOS:
    build:
      targets:
        JobHuntOS-macOS: all
    run:
      config: Debug
targets:
  JobHuntOS-iOS:
    type: application
    platform: iOS
    sources:
      - Sources/JobHuntApp
    dependencies:
      - package: JobHuntOSPackage
        product: JobHuntUI
    entitlements:
      path: Support/JobHuntOS-iOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jobhuntos.app
        PRODUCT_NAME: Job Hunt OS
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Support/JobHuntOS-iOS.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Support/Info-iOS.plist
        SWIFT_EMIT_LOC_STRINGS: YES
  JobHuntOS-macOS:
    type: application
    platform: macOS
    sources:
      - Sources/JobHuntApp
    dependencies:
      - package: JobHuntOSPackage
        product: JobHuntUI
    entitlements:
      path: Support/JobHuntOS-macOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jobhuntos.mac
        PRODUCT_NAME: Job Hunt OS
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Support/JobHuntOS-macOS.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Support/Info-macOS.plist
        COMBINE_HIDPI_IMAGES: YES
