services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobhunt
      POSTGRES_PASSWORD: jobhunt
      POSTGRES_DB: jobhunt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunt -d jobhunt"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - jobhunt_pg:/var/lib/postgresql/data

volumes:
  jobhunt_pg:
