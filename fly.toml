app = "job-hunt-os"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"
  ignorefile = "backend/.dockerignore"

[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  AUTH_ISSUER = "job-hunt-os"
  AWS_ENDPOINT_URL_S3 = "https://t3.storage.dev"
  AWS_REGION = "auto"
  GMAIL_PUBLIC_ENABLED = "false"

[processes]
  web = "npx tsx src/index.ts"
  worker = "env DATA_DIR=/data npx tsx src/worker.ts"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 35

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/api/health/live"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["web"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]

[[mounts]]
  source = "jobhunt_worker_data"
  destination = "/data"
  processes = ["worker"]
